x-api: &api-base
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - app-network
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 160M

services:

  api1:
    <<: *api-base
    container_name: api1
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SOCKET_PATH: /sockets/api1.sock
    cpuset: "0,1"

  api2:
    <<: *api-base
    container_name: api2
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SOCKET_PATH: /sockets/api2.sock
    cpuset: "2,3"

  nginx:
    image: nginx:alpine
    ports:
      - "9999:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    networks:
      - app-network
    cpuset: "0,2"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 30M

networks:
  app-network:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"
