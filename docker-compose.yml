x-api: &api-base
  build:
    context: ./src
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080
  volumes:
    - ./resources/references.json.gz:/app/App_Data/references.json.gz:ro
  networks:
    - app-network
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '0.45'
        memory: 165M

services:

  api1:
    <<: *api-base
    container_name: api1

  api2:
    <<: *api-base
    container_name: api2

  haproxy:
    image: haproxy:3.1-alpine
    ports:
      - "9999:80"
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 20M

networks:
  app-network:
    driver: bridge
