x-api: &api-base
  build:
    context: ./src
    dockerfile: Dockerfile
  networks:
    - app-network
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '0.40'
        memory: 165M

services:

  api1:
    <<: *api-base
    container_name: api1
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
    cpuset: "0,1"
  api2:
    <<: *api-base
    container_name: api2
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
    cpuset: "2,3"

  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - app-network
    restart: unless-stopped
    cpuset: "0,2"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 20M

networks:
  app-network:
    driver: bridge
