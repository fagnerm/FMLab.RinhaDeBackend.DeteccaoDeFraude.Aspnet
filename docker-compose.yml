x-api: &api-base
  build:
    context: ./src
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080
  networks:
    - app-network
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '0.45'
        memory: 160M

services:

  api1:
    <<: *api-base
    container_name: api1

  api2:
    <<: *api-base
    container_name: api2

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
