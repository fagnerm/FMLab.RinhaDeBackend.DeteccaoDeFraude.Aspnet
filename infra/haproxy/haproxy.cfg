global
    maxconn 4096
    nbthread 2

defaults
    mode http
    timeout connect 1s
    timeout client 15s
    timeout server 15s
    timeout queue 5s
    timeout http-keep-alive 60s
    option http-keep-alive
    option dontlognull
    no log

frontend http
    bind *:80
    default_backend apis

backend apis
    balance roundrobin
    http-reuse always
    server api1 unix@/sockets/api1.sock maxconn 1024
    server api2 unix@/sockets/api2.sock maxconn 1024
