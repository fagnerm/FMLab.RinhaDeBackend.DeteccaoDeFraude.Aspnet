global
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-server-close
    option forwardfor

frontend http
    bind *:80
    default_backend apis

backend apis
    balance roundrobin
    server api1 api1:8080
    server api2 api2:8080
